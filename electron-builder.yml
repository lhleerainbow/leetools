appId: com.leetools.app
productName: Leetools
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!.env'                              # 项目根目录的 .env（本地开发）绝不打包
  - '!.env.*'                            # 本地开发的 .env.local 等也绝不打包
  - '!{.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # CI 构建时会把百度 OCR 凭证写入 resources/.env —— 这个是要进安装包的，所以一定要包含
  - resources/**/*  #需要添加此行，否则打包后GitHub Action的环境变量无法打进包里，# 额外资源（如 .env），也要包含（resources/.env）
  - out/**/*    # 包含所有 electron-vite 构建产物（主进程、预加载、渲染器），必须包含
  - node_modules/**/*  # # 包含依赖（最好使用 asar 压缩）包含所有 node_modules 依赖，必须包含 
  - package.json    # 必须保留
extraResources: #如果 .env 文件被意外打包进了 app.asar 而不是 resources 目录，process.resourcesPath 会找不到它。
  - from: resources/
    to: .
    filter: ['*.env']  
asarUnpack:
  - resources/**     # resources/.env 会落在 process.resourcesPath/.env，不在 asar 内
win:
  executableName: LeeTools
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: leetools
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
