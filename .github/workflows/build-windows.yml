name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publishToRelease:
        description: '构建完成后是否发布到 GitHub Release（勾选=是；需要先在仓库里打一个 v* 标签）'
        required: false
        type: boolean
        default: false
      versionTag:
        description: '要发布到哪个标签，例如 v1.0.0（publishToRelease 勾选时填；留空=使用当前仓库最新的 v* tag）'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        arch: [x64] # x86 需要额外构建 32 位 Node，有需要再扩展

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25.x'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python for native modules (optional, for electron-rebuild)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Visual Studio Build Tools (msvc) for native addons
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        shell: pwsh
        run: |
          # 本仓库 .npmrc 使用 npmmirror 的 electron 镜像，CI 上回源到官方 registry 更稳定
          Set-Content -Path .npmrc -Encoding utf8 -Value "always-auth=false`n"
          npm ci --no-audit --no-fund --loglevel=error

      - name: Type check & Lint
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Baidu OCR credentials (optional GitHub Secrets)
        shell: pwsh
        env:
          BAIDU_OCR_API_KEY: ${{ secrets.BAIDU_OCR_API_KEY }}
          BAIDU_OCR_SECRET_KEY: ${{ secrets.BAIDU_OCR_SECRET_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apiKey = ($env:BAIDU_OCR_API_KEY ?? '').Trim()
          $secret = ($env:BAIDU_OCR_SECRET_KEY ?? '').Trim()
          $resDir = Join-Path (Get-Location) 'resources'
          if (-not (Test-Path $resDir)) {
            New-Item -ItemType Directory -Path $resDir -Force | Out-Null
          }
          $envPath = Join-Path $resDir '.env'

          if ([string]::IsNullOrWhiteSpace($apiKey) -or [string]::IsNullOrWhiteSpace($secret)) {
            Write-Host '===== GitHub Secrets 未配置 BAIDU_OCR_API_KEY / BAIDU_OCR_SECRET_KEY ====='
            Write-Host 'Tips: 打包后仍可通过 userData/config.json 单独配置 OCR 密钥，其它功能不受影响。'
            $content = @(
              '# Lee tools placeholder .env',
              '# Fill via GitHub Secrets BAIDU_OCR_API_KEY / BAIDU_OCR_SECRET_KEY at build time',
              '# Or write { "BAIDU_OCR_API_KEY":"...", "BAIDU_OCR_SECRET_KEY":"..." } into userData/config.json after install'
            ) -join "`n"
            Set-Content -Path $envPath -Encoding utf8 -Value $content
            exit 0
          }

          Write-Host '===== GitHub Secrets OCR 凭据已检测到，写入 resources/.env（打包后随安装包分发）====='
          $content = @(
            "BAIDU_OCR_API_KEY=$apiKey",
            "BAIDU_OCR_SECRET_KEY=$secret"
          ) -join "`n"
          Set-Content -Path $envPath -Encoding utf8 -Value $content
          $len = (Get-Item $envPath).Length
          Write-Host "Written $len bytes to $envPath"

      - name: Build app and pack Windows installer (electron-builder --win)
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build:win

      - name: List release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $productName = $pkg.PSObject.Properties.Name -contains 'productName' ? $pkg.productName : $pkg.name
          Write-Host "version=$ver"
          Write-Host "productName=$productName"
          "version=$ver"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "productName=$productName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 说明：electron-builder 默认输出目录是 release/，不是 dist/
      # artifactName（electron-builder.yml） = ${productName}-${version}-setup.exe
      # 且 productName 当前为 "Leetools"（无空格，见 electron-builder.yml L2），
      # 所以这里用通配符 *setup.exe 匹配，避免手写出错。
      - name: Upload build artifacts (Windows setup + latest update manifest)
        uses: actions/upload-artifact@v7
        with:
          name: Leetools-${{ steps.pkg.outputs.version }}-win-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml
            !dist/win-unpacked
          if-no-files-found: error
          retention-days: 90

      - name: Upload unpacked portable directory (optional debugging)
        uses: actions/upload-artifact@v7
        with:
          name: Leetools-${{ steps.pkg.outputs.version }}-win-${{ matrix.arch }}-unpacked
          path: release/win-unpacked/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve target tag for GitHub Release
        id: tag
        if: inputs.publishToRelease == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ("${{ inputs.versionTag }}").Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = git tag --list 'v*' --sort=-creatordate | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($tag)) {
              Write-Error "未找到任何 v* 标签，请先打一个 tag 并推送到远端。例如：`ngit tag -a v1.0.0 -m 'v1.0.0'; git push origin v1.0.0"
              exit 1
            }
          }
          if ($tag -notmatch '^v') {
            Write-Error "标签 $tag 必须以 v 开头，例如 v1.0.0"
            exit 1
          }
          Write-Host "目标 Release tag: $tag"
          "releaseTag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish to GitHub Release
        if: inputs.publishToRelease == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.releaseTag }}
          name: Release ${{ steps.tag.outputs.releaseTag }}
          files: |
            release/*-setup.exe
            release/latest.yml
            release/dev-app-update.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
