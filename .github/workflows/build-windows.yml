name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publishToRelease:
        description: '构建完成后是否发布到 GitHub Release（勾选=是；需要先在仓库里打一个 v* 标签才会找到对应 Release）'
        required: false
        type: boolean
        default: false
      versionTag:
        description: '要发布到哪个标签，例如 v1.0.0（publishToRelease 勾选时必填；留空且勾选时使用当前最新 tag）'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        arch: [x64] # x86 需要额外构建 32 位 Node，有需要再扩展

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25.x'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python for native modules (optional, for electron-rebuild)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Visual Studio Build Tools (msvc) for native addons
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install npm dependencies
        shell: pwsh
        run: |
          # GitHub Actions 默认使用 npm registry，electron/electron-builder 二进制包也有官方镜像
          # 这里覆盖 .npmrc 中的 npmmirror，避免在 CI 网络下回源超时
          @'
          always-auth=false
          '@ | Set-Content -Path .npmrc -Encoding UTF8
          npm ci --no-audit --no-fund --loglevel=error

      - name: Type check & Lint
        shell: pwsh
        run: npm run typecheck; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run lint; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Baidu OCR credentials (optional GitHub Secrets)
        shell: pwsh
        env:
          BAIDU_OCR_API_KEY: ${{ secrets.BAIDU_OCR_API_KEY }}
          BAIDU_OCR_SECRET_KEY: ${{ secrets.BAIDU_OCR_SECRET_KEY }}
        run: |
          # 只有当 BAIDU_OCR_API_KEY 与 BAIDU_OCR_SECRET_KEY 两个 Secrets 都配置了才写 resources/.env
          # 这样开发者不配也不会影响构建；配了就会把凭证打进安装包的 resources/.env，应用运行期读取
          $apiKey = ($env:BAIDU_OCR_API_KEY ?? '').Trim()
          $secret = ($env:BAIDU_OCR_SECRET_KEY ?? '').Trim()
          $resDir = Join-Path (Get-Location) "resources"
          if (-not (Test-Path $resDir)) {
            New-Item -ItemType Directory -Path $resDir -Force | Out-Null
          }
          $envPath = Join-Path $resDir ".env"
          if ([string]::IsNullOrWhiteSpace($apiKey) -or [string]::IsNullOrWhiteSpace($secret)) {
            Write-Host "⚠️  GitHub Secrets 未配置 BAIDU_OCR_API_KEY / BAIDU_OCR_SECRET_KEY，将不写入 resources/.env"
            Write-Host "   打包后的应用可以通过 userData/config.json 单独配置 OCR 密钥，其它功能不受影响。"
            # 若 resources/.env 不存在，electron-builder.yml 中已经单独 include 了这一条，且 pattern 允许，
            # 此时没有这个文件也不会报错（electron-builder 会忽略 include 的缺失文件）。
            # 为避免 include 在某些 builder 版本 strict 模式下失败，若 resources 目录仍为空占位，保留一个安全的空 .env（内容注释），
            # 它不会覆盖用户后续写入的凭证，因为 loadEnvFile 中以 process.env 优先。
            if (-not (Test-Path $envPath)) {
              "# Lee tools — placeholder .env`n# 请在 GitHub Secrets 或用户目录 config.json 中配置 BAIDU_OCR_API_KEY / BAIDU_OCR_SECRET_KEY`n" | `
                Set-Content -Path $envPath -Encoding UTF8
            }
            exit 0
          }
          Write-Host "✅ 检测到 GitHub Secrets 中的 OCR 凭证，正在写入 resources/.env（会随安装包分发）"
          @"
BAIDU_OCR_API_KEY=$apiKey
BAIDU_OCR_SECRET_KEY=$secret
"@ | Set-Content -Path $envPath -Encoding UTF8
          Write-Host "  resources/.env 已写入，大小: $([System.IO.FileInfo]::new($envPath).Length) bytes"

      - name: Build app and pack Windows installer (electron-builder --win)
        shell: pwsh
        env:
          # 使用 GitHub 缓存了的 electron 二进制，避免每次下载
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          # 禁止自动 publish，我们单独做 artifacts / GitHub Release
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:win

      - name: List release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Determine artifact name suffix
        id: artifact
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifacts (Windows setup + unpacked dir as zip)
        uses: actions/upload-artifact@v7
        with:
          name: Lee-tools-${{ steps.artifact.outputs.version }}-win-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml
            !dist/win-unpacked
          if-no-files-found: error
          retention-days: 90

      - name: Upload unpacked portable directory (optional debugging)
        uses: actions/upload-artifact@v7
        with:
          name: Lee-tools-${{ steps.artifact.outputs.version }}-win-${{ matrix.arch }}-unpacked
          path: release/win-unpacked/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve target tag for GitHub Release
        id: tag
        if: inputs.publishToRelease == true
        shell: pwsh
        run: |
          $tag = "${{ inputs.versionTag }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            # 用户没指定 tag：默认取当前 HEAD 上最新的以 v 开头的 tag
            $tag = git tag --list 'v*' --sort=-creatordate | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($tag)) {
              Write-Error "未找到任何 v* 标签，请先在仓库里打一个 tag（例如 git tag -a v1.0.0 -m 'v1.0.0'; git push origin v1.0.0）"
              exit 1
            }
          }
          if ($tag -notmatch '^v') {
            Write-Error "标签 $tag 必须以 v 开头，例如 v1.0.0"
            exit 1
          }
          Write-Host "将发布到 Release 标签：$tag"
          "releaseTag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish to GitHub Release (manual only)
        if: inputs.publishToRelease == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.releaseTag }}
          name: Release ${{ steps.tag.outputs.releaseTag }}
          files: |
            release/Lee tools-${{ steps.artifact.outputs.version }}-setup.exe
            release/*.yml
            release/*.yaml
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
